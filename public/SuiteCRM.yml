services:
  mariadb:
    image: mariadb:10.6
    container_name: suitecrm_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root1234
      MARIADB_DATABASE: suitecrm
      MARIADB_USER: suitecrm
      MARIADB_PASSWORD: suitecrm1234
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 10

  suitecrm:
    image: bitnamilegacy/suitecrm:8.8.1-debian-12-r2
    container_name: suitecrm_app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      SUITECRM_DATABASE_HOST: mariadb
      SUITECRM_DATABASE_PORT_NUMBER: 3306
      SUITECRM_DATABASE_USER: suitecrm
      SUITECRM_DATABASE_PASSWORD: suitecrm1234
      SUITECRM_DATABASE_NAME: suitecrm
      SUITECRM_DATABASE_CREATE_DATABASE: no
      SUITECRM_USERNAME: a
      SUITECRM_PASSWORD: a
      SUITECRM_HOST: localhost
      SUITECRM_EXTERNAL_HTTP_PORT_NUMBER: 8085
      SUITECRM_ENABLE_HTTPS: no
    volumes:
      - suitecrm_data:/bitnami/suitecrm

volumes:
  mariadb_data:
  suitecrm_data:
